services:
  mariadb:
    image: mysql:8.0
    container_name: toko_db
    environment:
      MYSQL_ROOT_PASSWORD: root_pass
      MYSQL_DATABASE: toko_app
      MYSQL_USER: toko_user
      MYSQL_PASSWORD: toko_pass
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
